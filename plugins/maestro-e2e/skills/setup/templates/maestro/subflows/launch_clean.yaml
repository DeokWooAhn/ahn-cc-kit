# 앱 데이터를 지우고 테스트 모드로 실행한 뒤 첫 화면이 뜰 때까지 기다린다.
# 모든 Flow는 이 subflow로 시작한다. 중간에 앱을 지우고 다시 띄워야 하면 직접 쓰지 말고 이걸 부른다.
#
# 바꿀 곳: 맨 아래 첫 화면 기준점 id(screen.home).
appId: ${APP_ID}
---
# 살아 있는 앱을 데이터 지우기로 강제 종료하면, 시스템이 약 1초 뒤 옛 태스크를 정리하면서 그 태스크의
# 프로세스를 한 번 더 죽인다. 그 1초 안에 다시 띄우면 새 프로세스가 같이 죽어 빈 화면으로 남는다.
# 느린 CI 에뮬레이터에서만 드러난다. 먼저 끄고 정리가 끝날 때까지 기다린다.
- runFlow:
    when:
      platform: Android
    commands:
      - stopApp
      # Maestro에는 sleep이 없다. 나타나지 않는 id를 optional로 기다리는 것으로 2초를 번다.
      - extendedWaitUntil:
          visible:
            id: "wait.never"
          timeout: 2000
          optional: true
- launchApp:
    clearState: true
    # 비워 두면 안 된다. 생략하면 기본값이 `all: allow`이고, Android에서는 권한 목록을 읽으려고 APK 전체를
    # 매번 adb로 받는다. CI 에뮬레이터에서 이 전송이 가끔 수 분씩 멈췄다.
    # 런타임 권한이 필요하면 `all` 대신 그 권한만 적는다(예: `notifications: allow`).
    permissions: {}
    arguments:
      # 앱이 디버그 빌드에서만 받아 광고 동의·광고·온보딩을 끈다.
      UI_TESTING: true
# 보이는 순간 넘어가므로 실기기에서는 오래 걸리지 않는다. CI 에뮬레이터 콜드 스타트를 감안해 넉넉히 둔다.
- extendedWaitUntil:
    visible:
      id: "screen.home"
    timeout: 30000
