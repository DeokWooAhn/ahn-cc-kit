[project]
name = "ahn-orchestrator"
version = "0.8.1"
description = "계획·구현·리뷰를 서로 다른 에이전트에 넘기는 왕복을 지휘하는 런타임"
requires-python = ">=3.12"
dependencies = []
license = { text = "MIT" }

[project.scripts]
orch = "orchestrator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
